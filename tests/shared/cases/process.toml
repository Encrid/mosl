[[case]]
name = "os_process_start finds a program on the PATH"
run = ["{out}/process{exe}", "{case}", "named", "process", "-"]
folders = { "{case}/bin" = ["process"] }
env = { PATH = "{case}/bin", PATHEXT = ".EXE" }
claims = { line = ["named: hi"] }
false = { env = { PATH = "{case}/none", PATHEXT = ".EXE" } }

[[case]]
name = "a relative path of a program starts in the folder of the process"
run = ["{out}/process{exe}", "{case}", "named", "./process{exe}", "{case}/bin"]
folders = { "{case}/bin" = ["process"] }
claims = { line = ["named: hi"] }
false = { run = ["{out}/process{exe}", "{case}", "named", "./process{exe}", "{case}/none"] }

[[case]]
name = "os_process_start gives nullptr for a program that it does not find"
run = ["{out}/process{exe}", "{case}", "named", "mosl_none", "-"]
claims = { line = ["named: none"] }
false = { run = ["{out}/process{exe}", "{case}", "named", "{out}/process{exe}", "-"] }

[[case]]
name = "os_process_start gives nullptr for a file that is not a program"
run = ["{out}/process{exe}", "{case}", "named", "./data.txt", "{case}"]
folders = { "{case}/bin" = ["process"] }
files = { "{case}/data.txt" = "data" }
claims = { line = ["named: none"] }
false = { run = ["{out}/process{exe}", "{case}", "named", "./process{exe}", "{case}/bin"] }

[[case]]
name = "the process gets the variables of env, and not the names of unset"
run = ["{out}/process{exe}", "{case}", "env", "unset"]
env = { MOSL_A = "0", MOSL = "x", MOSL_B = "2" }
claims = { line = ["env: 1 none"] }
false = { run = ["{out}/process{exe}", "{case}", "env", "keep"] }

[[case]]
name = "with errors_apart, the errors have a pipe of their own"
run = ["{out}/process{exe}", "{case}", "streams", "apart"]
claims = { line = ["streams: out=ac err=b"] }
false = { run = ["{out}/process{exe}", "{case}", "streams", "merged"] }

[[case]]
name = "without errors_apart, the errors go into the output in their order"
run = ["{out}/process{exe}", "{case}", "streams", "merged"]
claims = { line = ["streams: out=abc err="] }
false = { run = ["{out}/process{exe}", "{case}", "streams", "apart"] }

[[case]]
name = "os_process_write waits while the pipe is full"
run = ["{out}/process{exe}", "{case}", "full", "1048576"]
claims = { line = ["full: 0 1048576"] }
false = { run = ["{out}/process{exe}", "{case}", "full", "10"] }

[[case]]
name = "a write into a closed input gives -1, and does not end the caller"
run = ["{out}/process{exe}", "{case}", "closed", "exit"]
claims = { line = ["closed: -1"] }
false = { run = ["{out}/process{exe}", "{case}", "closed", "hold"] }

[[case]]
name = "os_process_read gives -2 when nanos pass and no byte came"
run = ["{out}/process{exe}", "{case}", "timeout", "hold", "1000000"]
claims = { line = ["timeout: -2"] }
false = { run = ["{out}/process{exe}", "{case}", "timeout", "say", "10000000000000000"] }

[[case]]
name = "the status of a process is its exit code"
run = ["{out}/process{exe}", "{case}", "status", "3"]
claims = { line = ["status: 3"] }
false = { run = ["{out}/process{exe}", "{case}", "status", "4"] }

[[case]]
name = "os_process_kill ends the process at once"
run = ["{out}/process{exe}", "{case}", "kill", "kill"]
claims = { line = ["kill: {kill_status}"] }
false = { run = ["{out}/process{exe}", "{case}", "kill", "close"] }

[[case]]
name = "a kill from another thread ends a read that waits"
run = ["{out}/process{exe}", "{case}", "kill-read", "hold"]
claims = { line = ["kill-read: 0"] }
false = { run = ["{out}/process{exe}", "{case}", "kill-read", "say"] }

[[case]]
name = "a kill from another thread ends a write that waits"
run = ["{out}/process{exe}", "{case}", "kill-write", "stall"]
claims = { line = ["kill-write: -1"] }
false = { run = ["{out}/process{exe}", "{case}", "kill-write", "drain"] }

[[case]]
name = "with ignore_interrupt, the process starts with SIGINT ignored"
run = ["{out}/process{exe}", "{case}", "interrupt", "ignore"]
claims = { line = ["interrupt: ignored"] }
false = { run = ["{out}/process{exe}", "{case}", "interrupt", "default"] }

[[case]]
name = "os_process_signal sends the interrupt"
run = ["{out}/process{exe}", "{case}", "signal", "interrupt"]
claims = { line = ["signal: 0 {interrupt_status}"] }
false = { run = ["{out}/process{exe}", "{case}", "signal", "termination"] }

[[case]]
name = "os_process_signal sends the termination"
run = ["{out}/process{exe}", "{case}", "signal", "termination"]
claims = { line = ["signal: 0 {termination_status}"] }
false = { run = ["{out}/process{exe}", "{case}", "signal", "interrupt"] }

[[case]]
name = "os_process_signal sends the hang-up"
run = ["{out}/process{exe}", "{case}", "signal", "hang-up"]
claims = { line = ["signal: 0 {hangup_status}"] }
false = { run = ["{out}/process{exe}", "{case}", "signal", "termination"] }

[[case]]
name = "a signal to a process that started without signals gives -1"
run = ["{out}/process{exe}", "{case}", "nosignal", "off"]
claims = { line = ["nosignal: -1"] }
false = { run = ["{out}/process{exe}", "{case}", "nosignal", "on"] }

[[case]]
name = "a signal after a hang-up gives -1"
run = ["{out}/process{exe}", "{case}", "hangup", "hang-up"]
claims = { line = ["hangup: 0 -1"] }
false = { run = ["{out}/process{exe}", "{case}", "hangup", "termination"] }

[[case]]
name = "os_process_free kills a process that runs and waits for its end"
run = ["{out}/process{exe}", "{case}", "free", "hold"]
claims = { line = ["free: done"] }
false = { run = ["{out}/process{exe}", "{case}", "free", "none"] }

[[case]]
name = "a read after the close of the output gives 0"
run = ["{out}/process{exe}", "{case}", "close", "output"]
claims = { line = ["close: 0"] }
false = { run = ["{out}/process{exe}", "{case}", "close", "input"] }

[[case]]
name = "os_process_wait gives 1 when nanos pass and the process runs"
run = ["{out}/process{exe}", "{case}", "wait", "hold"]
claims = { line = ["wait: 1"] }
false = { run = ["{out}/process{exe}", "{case}", "wait", "exit"] }

[[case]]
name = "a start is refused when its memory fails, and a later one is made"
run = ["{out}/process{exe}", "{case}", "again"]
fail = { calloc = 1 }
claims = { matches = ["again: [1-9] refused, then made"] }
false = { fail = {} }

[[case]]
name = "a start is refused when fork fails, and a later one is made"
run = ["{out}/process{exe}", "{case}", "again"]
fail = { fork = 1, CreateProcessW = 1 }
claims = { matches = ["again: [1-9] refused, then made"] }
false = { fail = {} }

[[case]]
name = "a start is refused when a pipe does not open, and a later one is made"
run = ["{out}/process{exe}", "{case}", "again"]
fail = { pipe2 = 1, pipe = 1 }
claims = { matches = ["again: [1-9] refused, then made"] }
false = { fail = {} }

[[case]]
name = "a start is refused when its last pipe does not open, and a later one is made"
run = ["{out}/process{exe}", "{case}", "again"]
fail = { pipe2 = 6, pipe = 6 }
claims = { matches = ["again: [1-9] refused, then made"] }
false = { fail = {} }

[[case]]
name = "a start is refused when the watch of the end fails, and a later one is made"
run = ["{out}/process{exe}", "{case}", "again"]
fail = { os_pidfd_open = 1, kqueue = 1, kevent = 1 }
claims = { matches = ["again: [1-9] refused, then made"] }
false = { fail = {} }

[[case]]
name = "a read gives -1 when its wait fails"
run = ["{out}/process{exe}", "{case}", "again"]
fail = { poll = 1 }
claims = { matches = ["again: [1-9] refused, then made"] }
false = { fail = {} }

[[case]]
name = "os_process_wait gives -1 when the wait of the system fails"
run = ["{out}/process{exe}", "{case}", "wait", "exit"]
fail = { waitid = 1 }
claims = { line = ["wait: -1"] }
false = { fail = {} }

[[case]]
name = "os_process_signal gives -1 when the signal cannot go"
run = ["{out}/process{exe}", "{case}", "signal", "interrupt"]
fail = { kill = 1 }
claims = { matches = ["signal: -1 "] }
false = { fail = {} }

[[case]]
name = "a start is refused when the memory of its environment fails, and a later one is made"
run = ["{out}/process{exe}", "{case}", "again"]
fail = { malloc = 3 }
claims = { matches = ["again: [1-9] refused, then made"] }
false = { fail = {} }

[[case]]
name = "a read gives -1 when the read of a pipe fails"
run = ["{out}/process{exe}", "{case}", "again"]
fail = { read = 2 }
claims = { matches = ["again: [1-9] refused, then made"] }
false = { fail = {} }

[[case]]
name = "os_process_wait gives -1 when its wait for the end fails"
run = ["{out}/process{exe}", "{case}", "wait", "exit"]
fail = { poll = 1, kevent = 2 }
claims = { line = ["wait: -1"] }
false = { fail = {} }

[[case]]
name = "a write gives -1 when its wait for room fails"
run = ["{out}/process{exe}", "{case}", "full", "1048576"]
fail = { poll = 1 }
claims = { matches = ["full: -1 "] }
false = { fail = {} }

[[case]]
name = "os_process_read gives -2 at once with no time left"
run = ["{out}/process{exe}", "{case}", "timeout", "hold", "0"]
claims = { line = ["timeout: -2"] }
false = { run = ["{out}/process{exe}", "{case}", "timeout", "say", "10000000000000000"] }

[[case]]
name = "a write after the close of the input gives -1"
run = ["{out}/process{exe}", "{case}", "write-after", "input"]
claims = { line = ["write-after: -1"] }
false = { run = ["{out}/process{exe}", "{case}", "write-after", "open"] }

[[case]]
name = "a signal that the caller catches does not end a read"
run = ["{out}/process{exe}", "{case}", "interrupted", "read", "hold"]
claims = { line = ["interrupted: -2"] }
false = { run = ["{out}/process{exe}", "{case}", "interrupted", "read", "say"] }

[[case]]
name = "a signal that the caller catches does not end a wait"
run = ["{out}/process{exe}", "{case}", "interrupted", "wait", "hold"]
claims = { line = ["interrupted: 1"] }
false = { run = ["{out}/process{exe}", "{case}", "interrupted", "wait", "exit"] }

[[case]]
name = "a signal that the caller catches does not end a write"
run = ["{out}/process{exe}", "{case}", "interrupted", "write", "stall"]
claims = { line = ["interrupted: -1"] }
false = { run = ["{out}/process{exe}", "{case}", "interrupted", "write", "drain"] }

[[case]]
name = "os_process_start gives nullptr when the folder of the process is not there"
run = ["{out}/process{exe}", "{case}", "named", "./process{exe}", "{case}/none"]
folders = { "{case}/bin" = ["process"] }
claims = { line = ["named: none"] }
false = { run = ["{out}/process{exe}", "{case}", "named", "./process{exe}", "{case}/bin"] }

[[case]]
name = "a free of no process does nothing"
run = ["{out}/process{exe}", "{case}", "free", "none"]
claims = { line = ["free: none"] }
false = { run = ["{out}/process{exe}", "{case}", "free", "hold"] }

[[case]]
name = "a read waits a time of more than 24 days, and gives the bytes that come"
run = ["{out}/process{exe}", "{case}", "timeout", "say", "10000000000000000"]
claims = { line = ["timeout: 2"] }
false = { run = ["{out}/process{exe}", "{case}", "timeout", "hold", "0"] }

[[case]]
name = "a kill of a process that ended does nothing"
run = ["{out}/process{exe}", "{case}", "late-kill", "5"]
claims = { line = ["late-kill: 5"] }
false = { run = ["{out}/process{exe}", "{case}", "late-kill", "6"] }

[[case]]
name = "a start is refused when the memory of the path of its program fails, and a later one is made"
run = ["{out}/process{exe}", "{case}", "again"]
fail = { malloc = 2 }
claims = { matches = ["again: [1-9] refused, then made"] }
false = { fail = {} }
