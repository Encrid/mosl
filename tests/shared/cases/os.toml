[[case]]
name = "the os layer runs every call and its error paths"
process = "state"
run = ["{out}/os{exe}", "{case}"]
claims = { matches = ["os ok"] }
false = { run = ["{out}/os{exe}", "{case}/none"] }

[[case]]
name = "a wait of less than a millisecond lasts until its nanoseconds pass"
process = "state"
run = ["{python}", "tests/wait_driver.py", "{out}/wait{exe}", "500000", "0", "200"]
claims = { line = ["0 of 200 first waits of a process took less than 500000 ns"] }
false = { run = ["{python}", "tests/wait_driver.py", "{out}/wait{exe}", "500000", "0", "200", "set"] }

[[case]]
name = "a wall clock behind the clock of the kernel does not change a wait, simulated on Linux and macOS"
process = "state"
run = ["{out}/wait{exe}", "50000000", "3600", "20"]
claims = { line = ["0 of 20 waits took less than 50000000 ns"] }
false = { run = ["{out}/wait{exe}", "50000000", "3600", "20", "set"] }

[[case]]
name = "memory"
run = ["{out}/memory{exe}"]
claims = { status = 0 }
rows = [
    { name = "os_reserve makes the first commit bytes readable, writable and zero", in = "commit 131072 65536 0", claims = { line = ["commit: 65536 zero, 65536 kept of 65536"] }, false = "commit 131072 16384 0" },
    { name = "os_commit makes more bytes of a reservation readable, writable and zero", in = "commit 131072 65536 131072", claims = { line = ["commit: 131072 zero, 131072 kept of 131072"] }, false = "commit 131072 65536 0" },
]

[[case]]
name = "a byte of a reservation past its commit faults when touched"
process = "status"
run = ["{out}/memory{exe}", "touch", "131072", "65536", "65536"]
claims = { status_not = 0, line = ["touch 65536"], lacks = ["touched"] }
false = { run = ["{out}/memory{exe}", "touch", "131072", "65536", "65535"] }

[[case]]
name = "threads"
run = ["{out}/threads{exe}"]
claims = { status = 0 }
rows = [
    { name = "os_mutex_lock waits while another thread holds the mutex", in = "held", claims = { line = ["mutex: waited, then taken"] }, false = "free" },
    { name = "os_get_thread_id gives 2 live threads 2 different numbers, and never 0", in = "ids thread", claims = { line = ["ids: differ, none 0"] }, false = "ids main" },
]

[[case]]
name = "wait"
run = ["{out}/wait{exe}"]
claims = { status = 0 }
rows = [
    { name = "a wait of no time consumes a set", in = "20000000 0 3 taken", claims = { line = ["0 of 3 waits took less than 20000000 ns", "status 0"] }, false = "20000000 0 3 set" },
]

[[case]]
name = "a thread gets the stack that its start asks for"
process = "status"
run = ["{out}/stack{exe}", "4194304", "3145728"]
claims = { status = 0, line = ["a call 3145728 bytes deep returned"] }
false = { run = ["{out}/stack{exe}", "1048576", "3145728"] }

[[case]]
name = "each started thread can use the stack that os_thread_stack_left gives, down to its last 4096 bytes"
process = "status"
run = ["{out}/stack_left{exe}", "thread", "4194304", "1048576"]
fail = { pthread_getattr_np = 1 }
claims = { status = 0, line = ["thread of 4194304 bytes: used down to 4096 bytes", "thread of 1048576 bytes: used down to 4096 bytes"] }
false = { run = ["{out}/stack_left{exe}", "thread", "4194304", "1048576", "past"] }

[[case]]
name = "the first thread of a process can use the stack that os_thread_stack_left gives, down to its last 4096 bytes"
process = "status"
run = ["{out}/stack_left{exe}", "main"]
claims = { status = 0, line = ["main: used down to 4096 bytes"] }
false = { run = ["{out}/stack_left{exe}", "main", "past"] }

[[case]]
name = "a process pins any number of libraries"
process = "state"
run = ["{out}/pins{exe}", "{case}", "65"]
claims = { line = ["pinned 65 of 65 libraries"] }
false = { run = ["{out}/pins{exe}", "{case}", "65", "closed"] }

[[case]]
name = "an interrupt sets the flag, and the program ends its work"
process = "signal"
run = ["{out}/signal{exe}", "a second signal ends it at once"]
stdin = "\n\n"
script = [{ wait = "ready", signal = "interrupt" }, { wait = "a second signal ends it at once" }]
claims = { status = 0, order = ["ready", "caught", "stopped"] }
false = { script = [{ wait = "ready", signal = "interrupt" }, { wait = "a second signal ends it at once", signal = "interrupt", pause = 1 }] }

[[case]]
name = "a termination sets the flag, and the program ends its work"
process = "signal"
run = ["{out}/signal{exe}", "a second signal ends it at once"]
stdin = "\n\n"
script = [{ wait = "ready", signal = "termination" }, { wait = "a second signal ends it at once" }]
claims = { status = 0, order = ["ready", "caught", "stopped"] }
false = { script = [{ wait = "ready", signal = "termination" }, { wait = "a second signal ends it at once", signal = "termination", pause = 1 }] }

[[case]]
name = "a hang-up sets the flag, and the program ends its work"
process = "signal"
run = ["{out}/signal{exe}", "a second signal ends it at once"]
stdin = "\n\n"
script = [{ wait = "ready", signal = "hang-up" }, { wait = "a second signal ends it at once" }]
claims = { status = 0, order = ["ready", "caught", "stopped"] }
false = { script = [{ wait = "ready", signal = "interrupt" }, { wait = "a second signal ends it at once", signal = "hang-up", pause = 1 }] }

[[case]]
name = "the first signal writes the line at once, while the program hangs"
process = "signal"
run = ["{out}/signal{exe}", "a second signal ends it at once"]
stdin = "\n\n"
script = [{ wait = "ready", signal = "interrupt", pause = 1 }]
claims = { order = ["ready", "a second signal ends it at once", "caught"] }
false = { ignore = ["interrupt"] }

[[case]]
name = "a second signal ends the program at once with status 1"
process = "signal"
run = ["{out}/signal{exe}", "a second signal ends it at once"]
stdin = "\n\n"
script = [{ wait = "ready", signal = "interrupt" }, { wait = "a second signal ends it at once", signal = "interrupt", pause = 1 }]
claims = { status = 1, order = ["ready", "a second signal ends it at once"], lacks = ["caught", "stopped"] }
false = { script = [{ wait = "ready", signal = "interrupt" }, { wait = "a second signal ends it at once" }] }

[[case]]
name = "a second signal ends the program at once while its output is full"
process = "signal"
run = ["{out}/signal{exe}", "a second signal ends it at once", "fill"]
stdin = "\n\n"
script = [{ wait = "ready", pause = 1 }, { signal = "interrupt", pause = 1 }, { signal = "interrupt", pause = 1 }]
claims = { status = 1, order = ["ready"] }
false = { script = [{ wait = "ready", pause = 1 }, { signal = "interrupt", pause = 1 }] }

[[case]]
name = "a signal that the parent ignores stays ignored"
process = "signal"
run = ["{out}/signal{exe}", "a second signal ends it at once"]
stdin = "\n\n"
ignore = ["interrupt"]
script = [{ wait = "ready", signal = "interrupt", pause = 1 }, { signal = "hang-up", pause = 1 }, { wait = "a second signal ends it at once" }]
claims = { status = 0, order = ["ready", "caught", "stopped"] }
false = { ignore = [] }

[[case]]
name = "a write to a closed output does not end the program"
process = "signal"
run = ["{out}/signal{exe}", "a second signal ends it at once"]
stdin = "\n\n"
script = [{ wait = "ready", close = "output", pause = 1 }, { signal = "interrupt", pause = 1 }]
claims = { status = 0, order = ["ready"] }
false = { script = [{ wait = "ready", close = "output", pause = 1 }, { signal = "interrupt", pause = 1 }, { signal = "interrupt", pause = 1 }] }

[[case]]
name = "the zip of a release holds fail.toml"
process = "command"
run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--pack"]
claims = { status = 0, order = ["{case}/out/mosl-{target}.zip", "fail.toml", "package proof: mosl ran"] }
false = { run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--pack", "--leave", "fail.toml"] }

[[case]]
name = "a folder past the path limit of the system lists and reads its file, whose name has 255 bytes"
process = "state"
run = ["{out}/folders{exe}", "{case}", "deep"]
claims = { line = ["deep: 0 refused, read 9 bytes: deep file"] }
false = { run = ["{out}/folders{exe}", "{case}", "joined"] }

[[case]]
name = "the current folder is refused past the path limit of the system"
process = "state"
run = ["{out}/folders{exe}", "{case}", "current"]
claims = { line = ["current: refused"] }
false = { run = ["{out}/folders{exe}", "{case}", "base"] }

[[case]]
name = "an open or a read of a folder is refused when a call that it needs fails, and a later one is made"
process = "state"
run = ["{out}/folders{exe}", "{case}", "deep"]
fail = { calloc = 1, malloc = 1, realloc = 1, ferror = 1 }
claims = { line = ["deep: 4 refused, read 9 bytes: deep file"] }
false = { fail = {} }

[[case]]
name = "an open of a folder is refused when the memory of its path fails, and a later one is made"
process = "state"
run = ["{out}/folders{exe}", "{case}", "deep"]
fail = { malloc = 2 }
claims = { line = ["deep: 1 refused, read 9 bytes: deep file"] }
false = { fail = {} }

[[case]]
name = "a watch is refused when a call that it needs fails, and a later one is made"
process = "state"
run = ["{out}/watch{exe}", "{case}", "refuse"]
fail = { calloc = 1, malloc = 1, realloc = 1, inotify_init1 = 1, os_path_whole = 1, os_folder_open = 1, os_mutex_create = 1, os_lib_open = 1, os_lib_get_symbol = 1, os_core_string = 1, os_core_array = 1, os_core_create = 1, os_core_start = 1, GetFinalPathNameByHandleW = 1, CreateFileW = 3, ReadDirectoryChangesW = 1 }
claims = { matches = ["refuse: [1-9][0-9]* refused, then made"] }
false = { fail = {} }

[[case]]
name = "a watch is refused when a later call that it needs fails, and a later one is made"
process = "state"
run = ["{out}/watch{exe}", "{case}", "refuse"]
fail = { calloc = 2, malloc = 2, inotify_add_watch = 2, os_core_create = 1, ReadDirectoryChangesW = 2 }
claims = { matches = ["refuse: [1-9][0-9]* refused, then made"] }
false = { fail = {} }

[[case]]
name = "whole"
run = ["{out}/whole{exe}"]
claims = { status = 0 }
rows = [
    { name = "a whole network path gets the form \\\\?\\UNC\\server\\share", in = "\\\\server\\share\\x", claims = { line = ["\\\\?\\UNC\\server\\share\\x"] }, false = "C:\\server\\share\\x" },
    { name = "a whole path in the form \\\\?\\ stays as it is", in = "\\\\?\\C:\\x", claims = { line = ["\\\\?\\C:\\x"] }, false = "\\\\x\\C:\\x" },
    { name = "a whole path in the form \\\\.\\ stays as it is", in = "\\\\.\\C:\\x", claims = { line = ["\\\\.\\C:\\x"] }, false = "\\\\y\\C:\\x" },
    { name = "a whole drive path, which GetFullPathNameW makes of a relative path, gets the form \\\\?\\", in = "C:\\dir\\x", claims = { line = ["\\\\?\\C:\\dir\\x"] }, false = "\\\\dir\\x" },
    { name = "a whole path that ends with a separator loses one separator", in = "C:\\mods\\", claims = { line = ["\\\\?\\C:\\mods"] }, false = "C:\\mods\\\\" },
    { name = "the whole root of a drive loses its separator", in = "C:\\", claims = { line = ["\\\\?\\C:"] }, false = "C:\\\\" },
    { name = "the root of a whole network path ends after its share", in = "root \\\\?\\UNC\\server\\share\\x", claims = { line = ["root ends at 20"] }, false = "root \\\\?\\UNC\\server\\x\\y\\z" },
    { name = "the root of a whole path of a drive ends after the drive, also at the end of the path", in = "root \\\\?\\C:", claims = { line = ["root ends at 6"] }, false = "root \\\\?\\UNC\\a\\b" },
]

[[case]]
name = "refuse"
run = ["{out}/refuse{exe}"]
sweep = ["CreateEventA", "malloc", "pthread_cond_init", "pthread_create", "pthread_mutex_init"]
claims = { status = 0 }
rows = [
    { name = "an event is refused when a call that it needs fails, and a later one is made", in = "+refuse malloc=1,pthread_mutex_init=1,pthread_cond_init=1,CreateEventA=1 event", claims = { matches = ["event: [1-9] refused, then made"] }, false = "event" },
    { name = "a mutex is refused when a call that it needs fails, and a later one is made", in = "+refuse malloc=1,pthread_mutex_init=1 mutex", claims = { matches = ["mutex: [1-9] refused, then made"] }, false = "mutex" },
    { name = "a thread is refused when a call that it needs fails, and a later one is made", in = "+refuse malloc=1,pthread_create=1 thread", claims = { matches = ["thread: [1-9] refused, then made"] }, false = "thread" },
]

[[case]]
name = "lock"
run = ["{out}/lock{exe}"]
sweep = ["_locking", "flock", "malloc"]
claims = { status = 0 }
rows = [
    { name = "os_unlock ends the lock, and a later os_lock in the process takes it again", in = "lock {case}/r0.lock unlock", claims = { line = ["lock: 0, then 0"] }, false = "lock {case}/f0.lock keep" },
    { name = "a second os_lock is refused with 1 while the first holds the file", in = "lock {case}/r1.lock keep", claims = { line = ["lock: 0, then 1"] }, false = "lock {case}/f1.lock unlock" },
    { name = "os_lock gives -1 and no handle for a file that does not open", in = "lock {case}/none/r2.lock keep", claims = { line = ["lock: -1, then -1"] }, false = "lock {case}/f2.lock keep" },
    { name = "os_lock gives -1 when its memory fails, and a later one takes the lock", in = "+refuse malloc=1 lock {case}/r3.lock keep", claims = { line = ["lock: -1, then 0"] }, false = "lock {case}/f3.lock keep" },
    { name = "os_lock gives -1, and not 1, when the system refuses the lock for a reason other than a held lock", in = "+refuse flock=1,_locking=1 lock {case}/r5.lock keep", claims = { line = ["lock: -1, then 0"] }, false = "lock {case}/f5.lock keep" },
    { name = "a write through a different handle is refused by the lock on Windows, and made on Linux and macOS", in = "write {case}/r4.lock", claims = { line = ["{lock_write}"] }, false = "write {case}/none/f4.lock" },
]

[[case]]
name = "os_lock gives 1 while another process holds the lock of the file"
process = "helper"
run = ["{out}/lock{exe}", "lock", "{case}/held.lock", "keep"]
helper = { run = ["{out}/lock{exe}", "hold", "{case}/held.lock"], wait = "hold: 0", stdin = "end\n", claims = { line = ["hold: 0"] } }
claims = { line = ["lock: 1, then 1"] }
false = { helper = {} }

[[case]]
name = "the end of a process ends its lock, and a later os_lock takes it within 10 seconds"
process = "helper"
run = ["{out}/lock{exe}", "retry", "{case}/left.lock"]
helper = { run = ["{out}/lock{exe}", "leave", "{case}/left.lock", "none"], wait = "leave: 0", claims = { line = ["leave: 0"] } }
claims = { line = ["retry: 0"] }
false = { helper = { run = ["{out}/lock{exe}", "hold", "{case}/left.lock"], wait = "hold: 0", stdin = "end\n", claims = { line = ["hold: 0"] } } }

[[case]]
name = "a program that the process starts with a call other than os_process_start does not get the file of the lock"
process = "helper"
run = ["{out}/lock{exe}", "retry", "{case}/child.lock"]
helper = { run = ["{out}/lock{exe}", "leave", "{case}/child.lock", "start"], wait = "leave: 0", stdin = "end\n", claims = { line = ["leave: 0", "child: end, 0 files"] } }
claims = { line = ["retry: 0"] }
false = { helper = { run = ["{out}/lock{exe}", "leave", "{case}/child.lock", "share"], wait = "leave: 0", stdin = "end\n", claims = { line = ["leave: 0", "child: end, 0 files"] } } }

[[case]]
name = "clock"
run = ["{out}/clock{exe}"]
claims = { status = 0 }
rows = [
    { name = "the clock of the os layer moves in steps below a microsecond", in = "1000", claims = { line = ["step below 1000 ns"] }, false = "1" },
]

[[case]]
name = "watch"
run = ["{out}/watch{exe}"]
claims = { status = 0 }
rows = [
    { name = "a new entry of a watched folder comes as its name", in = "{case}/r0 new", claims = { line = ["new: a.txt"] }, false = "{case}/f0 new beside" },
    { name = "a changed entry of a watched folder comes as its name", in = "{case}/r1 changed", claims = { line = ["changed: a.txt"] }, false = "{case}/f1 changed other" },
    { name = "a removed entry of a watched folder comes as its name", in = "{case}/r2 removed", claims = { line = ["removed: a.txt"] }, false = "{case}/f2 removed other" },
    { name = "a watch gives the names down to its depth, and no deeper name", in = "{case}/r3 depth", claims = { line = ["depth: sub/b.txt at 2, nothing at 1, nothing at 2"] }, false = "{case}/f3 depth flat" },
    { name = "a watch of a depth of 0 is refused", in = "{case}/r4 zero", claims = { line = ["zero: refused"] }, false = "{case}/f4 zero one" },
    { name = "a take with no change gives 0 at once", in = "{case}/r5 quiet", claims = { line = ["quiet: 1000 of 1000 takes gave 0, at once"] }, false = "{case}/f5 quiet busy" },
    { name = "a burst of new entries comes as each of their names", in = "{case}/r6 burst", claims = { line = ["burst: 100 of 100"] }, false = "{case}/f6 burst beside" },
    { name = "changes that do not fit between two takes give 2, and the watch goes on", in = "{case}/r7 overflow", claims = { line = ["overflow: 2, then after.txt"] }, false = "{case}/f7 overflow few" },
    { name = "a removed folder stops its watch, and each later take gives -1", in = "{case}/r8 gone", claims = { line = ["gone: -1, then -1"] }, false = "{case}/f8 gone beside" },
    { name = "a folder moved to a name of the same length or of a different length stops its watch", in = "{case}/r9 moved", claims = { line = ["moved: -1 and -1"] }, false = "{case}/f9 moved beside" },
    { name = "a folder made beside a watched folder does not stop its watch", in = "{case}/r10 beside", claims = { line = ["beside: marker, still watching"] }, false = "{case}/f10 beside moved" },
    { name = "a folder that comes into a watched folder gets its watch before its name comes, down to the depth", in = "{case}/r11 folders", claims = { line = ["folders: new, new/x.txt, new/inner and sub"] }, false = "{case}/f11 folders flat" },
    { name = "a folder renamed in a watched folder comes as its two names, and its entries come with the new name", in = "{case}/r12 renamed", claims = { line = ["renamed: sub, moved and moved/inner/x.txt"] }, false = "{case}/f12 renamed still" },
    { name = "the root of the drive of a folder, or /, can be watched", in = "{case}/r13 root", claims = { line = ["root: watched"] }, false = "{case}/f13 root missing" },
    { name = "a watch of a folder that is not there, or of a file, is refused", in = "{case}/r14 missing", claims = { line = ["missing: refused, file: refused"] }, false = "{case}/f14 missing made" },
]

