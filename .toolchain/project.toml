[project]
name = "mosl"
targets = ["x86_64-windows-gnu", "x86_64-linux-gnu", "aarch64-macos", "aarch64-linux-gnu", "x86_64-macos", "aarch64-windows-gnu"]

[test]
cases = "tests/shared/cases"
timeout = 120
copies = 1

[[style.exception]]
rule = "F5"
path = "src/macos/watch_events.c:on_events"
why = "FSEvents fixes the 6 parameters of its callback."
